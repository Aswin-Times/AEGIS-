[alembic]
script_location = migrations
# The URL is never stored here. It comes from AEGIS_MIGRATION_DATABASE_URL, or from
# the "url" attribute set on the Alembic config by aegis.db.bootstrap.

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s %(message)s
